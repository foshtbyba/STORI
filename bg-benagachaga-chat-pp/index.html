<!DOCTYPE html>
<html lang="BG"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>Benaga Chaga — онлайн консултация</title>

<style>
:root{--primary:#1f3d6d;--blue:#4aa2f5;--blue2:#71c2ff;--blue-d:#0ea5e9;--txt:#1f3d6d;--muted:#6b86a8;--line:#dbe7fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:linear-gradient(140deg,#f5faff 0%,#e1ecff 50%,#c8dcff 100%);display:flex;justify-content:center;color:var(--txt)}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
header{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:3;box-shadow:0 2px 14px rgba(31,61,109,.08);border-bottom:1px solid var(--line)}
.avatar{width:46px;height:46px;border-radius:50%;flex:0 0 auto;background:linear-gradient(135deg,var(--blue2),var(--blue));display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;color:#fff;position:relative;box-shadow:0 4px 12px rgba(74,162,245,.35)}
.avatar .dot{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#22c55e;border:2px solid #fff}
.avatar>img,.savatar>img,.bubav>img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.hmeta{flex:1;min-width:0}
.hname{font-size:16px;font-weight:600;line-height:1.2;color:var(--primary)}
.hstatus{font-size:12px;color:#1aa06b;display:flex;align-items:center;gap:5px;margin-top:1px}
.hbadge{font-size:10.5px;color:var(--blue-d);background:#e0f2fe;padding:2px 9px;border-radius:999px;margin-top:3px;display:inline-block;font-weight:500}
#log{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:10px;z-index:2;scroll-behavior:smooth}
#log::-webkit-scrollbar{width:4px}
#log::-webkit-scrollbar-track{background:transparent}
#log::-webkit-scrollbar-thumb{background:rgba(74,162,245,.25);border-radius:4px}
#log::-webkit-scrollbar-thumb:hover{background:rgba(74,162,245,.45)}
#log{scrollbar-width:thin;scrollbar-color:rgba(74,162,245,.25) transparent}
.row{display:flex;max-width:100%;align-items:flex-end;gap:8px}
.row.in{justify-content:flex-start}
.row.out{justify-content:flex-end}
.bubav{width:28px;height:28px;border-radius:50%;flex:0 0 auto;align-self:flex-end;background:linear-gradient(135deg,var(--blue2),var(--blue));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;box-shadow:0 2px 6px rgba(74,162,245,.3)}
.bubble{max-width:78%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap;position:relative}
.in .bubble{background:#fff;color:var(--primary);border-bottom-left-radius:5px;box-shadow:0 3px 14px rgba(31,61,109,.09)}
.out .bubble{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;border-bottom-right-radius:5px;box-shadow:0 3px 14px rgba(74,162,245,.3)}
.note{font-size:13px;color:var(--muted);text-align:center;width:100%;padding:8px 16px;line-height:1.4}
.typing{display:inline-flex;gap:4px;padding:11px 14px;background:#fff;border-radius:18px;border-bottom-left-radius:5px;box-shadow:0 3px 14px rgba(31,61,109,.09)}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--blue);opacity:.5;animation:bl 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:.9}}
.caret{display:inline-block;width:2px;height:1em;background:var(--blue);margin-left:1px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
#chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 12px 4px;z-index:2}
.chip{background:#fff;border:1.5px solid var(--blue2);color:var(--blue-d);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer;transition:.15s;box-shadow:0 2px 8px rgba(74,162,245,.15)}
.chip:active{background:#eaf4ff}
footer{background:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;z-index:3;border-top:1px solid var(--line)}
footer.closed{opacity:.5;pointer-events:none}
#inp{flex:1;background:#f1f6fd;border:1px solid var(--line);border-radius:22px;padding:11px 16px;color:var(--primary);font-size:15px;outline:none;resize:none;max-height:100px;font-family:inherit;overflow:hidden}
#inp:focus{border-color:var(--blue2)}
#send{width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;font-size:19px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(74,162,245,.4)}
#send:disabled{opacity:.5}
#splash{position:absolute;inset:0;z-index:10;background:linear-gradient(140deg,#eaf3ff,#c8dcff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
.savatar{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--blue2),var(--blue));display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;font-weight:600;box-shadow:0 12px 34px rgba(74,162,245,.45)}
.sname{font-size:20px;font-weight:600;color:var(--primary)}
.sbadge{font-size:13px;color:var(--blue-d);background:#e0f2fe;padding:4px 14px;border-radius:999px}
</style>

<body>
<div id="app">
  <div id="splash">
    <div class="savatar"><img src="images/doctor.jpg" alt></div>
    <div class="sname">Д-р Георги Димитров</div>
    <div class="sbadge">Гастроентеролог</div>
    <div class="typing" style="background:transparent;box-shadow:none;padding:6px"><span></span><span></span><span></span></div>
  </div>
  <header>
    <div class="avatar"><img src="images/doctor.jpg" alt><span class="dot"></span></div>
    <div class="hmeta">
      <div class="hname">Д-р Георги Димитров</div>
      <div class="hstatus" id="hstatus"><span>на линия</span></div>
      <span class="hbadge">Гастроентеролог</span>
    </div>
  </header>

  <div id="log"></div>
  <div id="chips"></div>

  <footer>
    <textarea id="inp" rows="1" placeholder="Напишете съобщение" autocomplete="off"></textarea>
    <button id="send">➤</button>
  </footer>
</div>

<!-- Hidden iframe for form submit (no redirect) -->
<iframe name="leadframe" style="display:none"></iframe>

<!-- Keitaro lead form -->
<form action="order.php" method="post" class="order_form" id="leadform" style="display:none" target="leadframe">
<input type="hidden" name="subid" value="{subid}">
        <input type="hidden" name="country" value="BG">
        <input type="hidden" name="utm_content" value="{sub_id_2}">

  <input type="hidden" name="name" id="lead_name">
  <input type="hidden" name="phone" id="lead_phone">
  <input type="hidden" name="subid2" value="{sub_id_2}">
  <input type="hidden" name="cid" value="{campaign_id}">
  <input type="hidden" name="sid" value="5113">
  <input type="hidden" name="hash" value="{hash}">
  </form>

<script>
const $=s=>document.querySelector(s);
const log=$("#log"),chips=$("#chips"),inp=$("#inp"),send=$("#send");
let busy=false;

const DLG_TTL=86400000;
const DLG_VER=13;
const GREETING="Здравейте! 😊 Вие сигурно видяхте за домашния метод, който заменя операцията. Аз съм д-р Георги Димитров — гастроентерологът, който разработи тази формула. Кажете ми — какви стомашни оплаквания имате?";
const GREETING_CHIPS=["Болка в корема","Киселини / рефлукс","Подуване / газове"];

function storeKey(){return "benagachaga_bg_chat";}
function blankDlg(){
  return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),
          ver:DLG_VER,chat:[],chips:[],lead_sent:false,closed:false,ts:Date.now()};
}
function loadDlg(){
  try{
    const raw=localStorage.getItem(storeKey());
    if(raw){const d=JSON.parse(raw);if(d&&d.ver===DLG_VER&&d.ts&&Date.now()-d.ts<DLG_TTL&&Array.isArray(d.chat))return d;}
  }catch(e){}
  return blankDlg();
}
function saveDlg(){DLG.ts=Date.now();try{localStorage.setItem(storeKey(),JSON.stringify(DLG));}catch(e){}}
let DLG=loadDlg();

const AVATAR_IMG="images/doctor.jpg";
function avEl(){
  const av=document.createElement("div");av.className="bubav";
  const im=document.createElement("img");im.src=AVATAR_IMG;im.alt="";av.appendChild(im);
  return av;
}

function addBubble(text,side,hist){
  const row=document.createElement("div");row.className="row "+side;
  if(side==="sys"){
    const n=document.createElement("div");n.className="note";
    n.append(document.createTextNode(text));row.appendChild(n);
  }else{
    if(side==="in"){row.appendChild(avEl());}
    const b=document.createElement("div");b.className="bubble";
    b.append(document.createTextNode(text));row.appendChild(b);
  }
  log.appendChild(row);
  setTimeout(()=>{log.scrollTop=log.scrollHeight;},50);
  if(!hist){
    DLG.chat.push({side:side,text:text});
    if(DLG.chat.length>200)DLG.chat=DLG.chat.slice(-200);
    saveDlg();
  }
}

function typeBot(text){
  return new Promise(res=>{
    const row=document.createElement("div");row.className="row in";
    row.appendChild(avEl());
    const b=document.createElement("div");b.className="bubble";row.appendChild(b);
    const span=document.createElement("span");b.appendChild(span);
    const caret=document.createElement("span");caret.className="caret";b.appendChild(caret);
    log.appendChild(row);log.scrollTop=log.scrollHeight;
    const chars=Array.from(String(text));let i=0;
    (function step(){
      if(i>=chars.length){
        caret.remove();
        DLG.chat.push({side:"in",text:text});
        if(DLG.chat.length>200)DLG.chat=DLG.chat.slice(-200);
        saveDlg();res();return;
      }
      const ch=chars[i++];span.textContent+=ch;log.scrollTop=log.scrollHeight;
      let d=18;if(ch===" ")d=10;else if(".,!?…:".indexOf(ch)>=0)d=85;else if(ch==="\n")d=55;
      setTimeout(step,d);
    })();
  });
}

function typing(on){
  let e=$("#tp");
  if(on){if(e)return;const row=document.createElement("div");row.className="row in";row.id="tp";
    row.appendChild(avEl());
    const b=document.createElement("div");b.className="typing";b.innerHTML="<span></span><span></span><span></span>";
    row.appendChild(b);log.appendChild(row);setTimeout(()=>{log.scrollTop=log.scrollHeight;},50);}
  else if(e)e.remove();
}

function renderChips(arr){
  chips.innerHTML="";
  (arr||[]).forEach(c=>{
    const el=document.createElement("div");el.className="chip";el.textContent=c;
    el.onclick=()=>{if(!busy)handleUser(c);};chips.appendChild(el);
  });
}

function setStatus(s){$("#hstatus").innerHTML="<span>"+s+"</span>";}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}

const CLOSED_NOTE="Чатът е затворен. Консултант ще ви се обади на посочения номер в следващите 10-15 минути.";

function closeChat(){
  DLG.closed=true;saveDlg();
  renderChips([]);
  inp.value="";inp.disabled=true;inp.placeholder="Чатът е затворен";
  send.disabled=true;
  document.querySelector("footer").classList.add("closed");
  setStatus("поръчка регистрирана");
}

function postLead(lead){
  if(DLG.lead_sent||!lead||!lead.name||!lead.phone)return;
  DLG.lead_sent=true;saveDlg();
  document.getElementById("lead_name").value=lead.name;
  document.getElementById("lead_phone").value=lead.phone;
  document.getElementById("leadform").submit();
  try{fbq('track','Lead');}catch(e){}
}

function countUserMsgs(){
  let n=0;
  DLG.chat.forEach(function(m){if(m.side==="out")n++;});
  return n;
}
function buildHistory(){
  const h=[];
  DLG.chat.forEach(function(m){
    if(m.text&&(m.text.indexOf("Грешка:")===0||m.text.indexOf("⚠️")===0))return;
    if(m.side==="sys")return;
    if(m.side==="out") h.push({role:"user",content:m.text});
    else if(m.side==="in") h.push({role:"assistant",content:m.text});
  });
  if(h.length>24) return h.slice(-24);
  return h;
}

async function api(payload){
  const body=Object.assign({},payload);
  body.history=buildHistory();
  body.step=countUserMsgs();
  const fd=new FormData();
  fd.append("d",JSON.stringify(body));
  let r;
  try{
    r=await fetch("chat.php",{method:"POST",body:fd});
  }catch(e){
    throw new Error("Fetch failed: "+e.message);
  }
  const txt=await r.text();
  if(!r.ok)throw new Error("HTTP "+r.status+": "+txt.substring(0,200));
  let j;
  try{j=JSON.parse(txt);}catch(e){throw new Error("Не JSON: "+txt.substring(0,200));}
  if(!j.ok)throw new Error(j.error||"unknown error");
  return j;
}

async function turn(payload){
  busy=true;send.disabled=true;renderChips([]);setStatus("пише…");
  try{
    const d=await api(payload);
    saveDlg();

    const msgs=d.messages||["…"];
    for(let i=0;i<msgs.length;i++){
      if(i>0)await wait(350);
      typing(true);
      await wait(500+Math.min(1200,(msgs[i]||"").length*18));
      typing(false);
      await typeBot(msgs[i]);
      log.scrollTop=log.scrollHeight;
    }
    setTimeout(()=>{log.scrollTop=log.scrollHeight;},100);
    setStatus("на линия");

    if(d.lead){
      postLead(d.lead);
      await wait(900);
      addBubble(CLOSED_NOTE,"sys");
      closeChat();
      busy=false;
      return;
    }

    const showChips=d.quick_replies||[];
    renderChips(showChips);
    DLG.chips=showChips;saveDlg();
  }catch(e){
    setStatus("на линия");addBubble("Връзката прекъсна. Моля, проверете интернет връзката си и опитайте отново.","in");
  }
  busy=false;send.disabled=false;
}

function handleUser(text){
  if(!text.trim()||busy)return;
  addBubble(text,"out");
  turn({op:"say",text:text});
}

async function start(){
  log.innerHTML="";chips.innerHTML="";
  if(DLG.chat.length){
    DLG.chat.forEach(m=>addBubble(m.text,m.side,true));
    if(!DLG.closed)renderChips(DLG.chips||[]);
    if(DLG.closed)closeChat();
    return;
  }
  try{fbq('track','InitiateCheckout');}catch(e){}
  await typeBot(GREETING);
  renderChips(GREETING_CHIPS);
  DLG.chips=GREETING_CHIPS;saveDlg();
}

setTimeout(function(){const s=document.getElementById("splash");if(s)s.classList.add("hide");},1700);

send.onclick=()=>{const v=inp.value;inp.value="";inp.style.height="auto";handleUser(v);};
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send.onclick();}});
inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=Math.min(100,inp.scrollHeight)+"px";});

start();
try{fbq('track','ViewContent');}catch(e){}
</script>
