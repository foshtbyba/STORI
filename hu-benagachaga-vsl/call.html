<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benaga Chaga — Jelentkezés elfogadva</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f0e8;font-family:Georgia,'Times New Roman',serif;color:#3a3226;padding:20px}
.cert{max-width:520px;width:100%;background:#fffdf7;border:3px double #b8a87a;border-radius:12px;padding:48px 36px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08);position:relative}
.cert::before{content:'';position:absolute;inset:8px;border:1px solid #d4c9a8;border-radius:8px;pointer-events:none}
.seal{width:72px;height:72px;margin:0 auto 20px}
.seal svg{width:100%;height:100%}
.k{font-family:Inter,Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#8a7d65;margin-bottom:12px;display:block}
.prod-img{max-width:160px;width:60%;height:auto;display:block;margin:0 auto 16px;border-radius:8px}
h1{font-size:22px;font-weight:700;margin-bottom:12px;color:#2d2518}
p{font-size:15px;line-height:1.6;color:#5a5040;margin-bottom:8px}
.fl{width:60px;height:1px;background:#c4b68a;margin:20px auto}
.oid{font-size:12px;color:#a09880;margin-top:16px;font-family:Inter,Helvetica,Arial,sans-serif}
</style>
<!-- Facebook Pixel -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
(function () {
  var PID = '';
  try { PID = localStorage.getItem('fb_pixel') || ''; } catch (e) {}
  var u = new URLSearchParams(location.search).get('fbpx');
  if (u) PID = u;
  else { var m = '{fbpx}'; if (m.indexOf('{') === -1 && m) PID = m; }
  if (PID) {
    try { localStorage.setItem('fb_pixel', PID); } catch (e) {}
    fbq('init', PID);
    fbq('track', 'PageView');
    fbq('track', 'Lead');
  }
})();
</script>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id={fbpx}&ev=PageView&noscript=1"></noscript>
</head>
<body>
<div class="cert">
  <div class="seal">
    <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="36" cy="36" r="34" stroke="#b8a87a" stroke-width="2" fill="#fffdf7"/>
      <circle cx="36" cy="36" r="28" stroke="#d4c9a8" stroke-width="1"/>
      <path d="M24 36l8 8 16-16" stroke="#6b8f4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <span class="k">Benaga Chaga</span>
  <img src="images/ART.png" alt="Benaga Chaga" class="prod-img">
  <h1>Jelentkezését elfogadtuk!</h1>
  <div class="fl"></div>
  <p>Munkatársunk hamarosan felveszi Önnel a kapcsolatot a rendelés megerősítése és a szállítási részletek egyeztetése érdekében.</p>
  <p>Kérjük, tartsa kéznél a telefonját.</p>
  <div class="fl"></div>
  <div class="oid">Köszönjük a bizalmát</div>
</div>
</body>
</html>
