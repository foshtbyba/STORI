<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cordyceps Pulse — Hiba</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f0e8;font-family:Georgia,'Times New Roman',serif;color:#3a3226;padding:20px}
.cert{max-width:520px;width:100%;background:#fffdf7;border:3px double #cf9a8f;border-radius:12px;padding:48px 36px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08);position:relative}
.cert::before{content:'';position:absolute;inset:8px;border:1px solid #e0c4bc;border-radius:8px;pointer-events:none}
.seal{width:72px;height:72px;margin:0 auto 20px}
.seal svg{width:100%;height:100%}
.k{font-family:Inter,Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#8a7d65;margin-bottom:24px;display:block}
h1{font-size:22px;font-weight:700;margin-bottom:12px;color:#6b2d1a}
p{font-size:15px;line-height:1.6;color:#5a5040;margin-bottom:8px}
.fl{width:60px;height:1px;background:#cf9a8f;margin:20px auto}
.btn{display:inline-block;margin-top:24px;padding:14px 36px;background:#8b5e3c;color:#fff;border:none;border-radius:8px;font-size:15px;font-family:Inter,Helvetica,Arial,sans-serif;cursor:pointer;text-decoration:none;transition:background .2s}
.btn:hover{background:#6b4428}
</style>
<!-- Facebook Pixel -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
(function () {
  var PID = '';
  try { PID = localStorage.getItem('fb_pixel') || ''; } catch (e) {}
  var u = new URLSearchParams(location.search).get('fbpx');
  if (u) PID = u;
  else { var m = '{fbpx}'; if (m.indexOf('{') === -1 && m) PID = m; }
  if (PID) {
    try { localStorage.setItem('fb_pixel', PID); } catch (e) {}
    fbq('init', PID);
    fbq('track', 'PageView');
  }
})();
</script>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id={fbpx}&ev=PageView&noscript=1"></noscript>
</head>
<body>
<div class="cert">
  <div class="seal">
    <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="36" cy="36" r="34" stroke="#cf9a8f" stroke-width="2" fill="#fffdf7"/>
      <circle cx="36" cy="36" r="28" stroke="#e0c4bc" stroke-width="1"/>
      <line x1="36" y1="22" x2="36" y2="42" stroke="#a0432e" stroke-width="3" stroke-linecap="round"/>
      <circle cx="36" cy="50" r="2" fill="#a0432e"/>
    </svg>
  </div>
  <span class="k">Cordyceps Pulse</span>
  <h1>Hiba történt</h1>
  <div class="fl"></div>
  <p>Sajnos nem sikerült elküldeni a jelentkezését. Kérjük, próbálja meg újra.</p>
  <div class="fl"></div>
  <button class="btn" onclick="history.back()">Újra kitöltés</button>
</div>
</body>
</html>
