<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #141414; font-family: 'Manrope', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; color: #E4E4E4; }
    a { color: #B4C68C; text-decoration: none; } a:hover { color: #CE6E58; }
    .n { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
    .p { background: #1C1C1D; border: 1px solid #2E2E2F; border-radius: 26px; }
    .b { width: 42px; height: 42px; border-radius: 50%; background: #292930; display: flex; align-items: center; justify-content: center; flex: 0 0 42px; }
    .ib { width: 32px; height: 32px; border-radius: 50%; background: #232324; display: flex; align-items: center; justify-content: center; flex: 0 0 32px; }
    .h { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }
    .s { font-size: 12.5px; color: #8A8A8A; }
    .lab { font-size: 10.5px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: #8A8A8A; }
    .pill { border-radius: 999px; }
    .sub { background: #232324; border-radius: 18px; }
  </style>
</helmet>

<div style="width: 1440px; min-height: 1320px; background: #141414; padding: 16px; display: flex; flex-direction: column; gap: 14px;">
    <div class="p" style="display: flex; align-items: center; justify-content: space-between; height: 78px; padding: 0 14px 0 16px;">
      <div style="display: flex; align-items: center; gap: 16px;">
        <div class="b" style="background: #2C3624;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4C68C" stroke-width="1.7" stroke-linejoin="round"><path d="M2.5 20h19L14 5l-3.4 6.5L8.4 8z"/></svg>
        </div>
        <span style="font-size: 19px; font-weight: 700; letter-spacing: -0.02em;">База офферов</span>
        <span style="width: 1px; height: 22px; background: #3A3A3B;"></span>
        <span class="n" style="font-size: 16px; color: #A8A8A8;">18 карточек</span>
      </div>
      <div style="display: flex; align-items: center; gap: 22px;">
        <div style="display: flex; align-items: center; gap: 9px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="1.7"><path d="M12 21s7-6.3 7-11a7 7 0 10-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
          <span style="font-size: 14px; color: #C4C4C4;">11 активных</span>
        </div>
        <span style="width: 1px; height: 20px; background: #2E2E2F;"></span>
        <div style="display: flex; align-items: center; gap: 9px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="1.7" stroke-linejoin="round"><path d="M3 19h18L14.5 6l-3 5.5L9.5 9z"/></svg>
          <span class="n" style="font-size: 14px; color: #B4C68C;">обновлено 26.08</span>
        </div>
        <div class="pill" style="display: flex; align-items: center; gap: 12px; background: #232324; padding: 7px 12px 7px 14px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="1.7"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3 2.7-5 6-5s6 2 6 5"/><path d="M17 11.5a3 3 0 100-6"/></svg>
          <div style="display: flex;">
            <sc-for list="{{ crew }}" as="c" hint-placeholder-count="5">
              <div class="n" style="width: 32px; height: 32px; border-radius: 50%; background: {{ c.bg }}; border: 2px solid #1C1C1D; margin-left: -9px; display: flex; align-items: center; justify-content: center; font-size: 10.5px; color: {{ c.fg }};">{{ c.t }}</div>
            </sc-for>
          </div>
        </div>
      </div>
    </div>

  <div class="p" style="display: flex; align-items: center; gap: 26px; height: 68px; padding: 0 22px;">
    <div style="display: flex; align-items: center; gap: 11px; width: 260px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
      <span class="s" style="font-size: 13.5px;">Название, гео, партнёрка…</span>
    </div>
    <span style="width: 1px; height: 24px; background: #2E2E2F;"></span>
    <div style="display: flex; align-items: center; gap: 9px;">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
        <div class="pill" style="padding: 8px 16px; background: {{ c.bg }};"><span style="font-size: 13px; font-weight: {{ c.w }}; color: {{ c.fg }};">{{ c.t }}</span></div>
      </sc-for>
    </div>
    <div style="flex-grow: 1;"></div>
    <div class="pill" style="display: flex; align-items: center; gap: 9px; padding: 8px 15px; background: #232324;">
      <span class="s" style="font-size: 12.5px;">Вертикаль</span>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2.6"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="pill" style="display: flex; align-items: center; gap: 9px; padding: 8px 15px; background: #232324;">
      <span class="s" style="font-size: 12.5px;">Гео</span>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2.6"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="pill" style="display: flex; align-items: center; gap: 8px; padding: 9px 17px; background: #B4C68C;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1C1C1D" stroke-width="2.8"><path d="M12 5v14M5 12h14"/></svg>
      <span style="font-size: 13px; font-weight: 600; color: #1C1C1D;">Оффер</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;">
    <sc-for list="{{ offers }}" as="o" hint-placeholder-count="6">
      <div class="p" style="padding: 14px; display: flex; flex-direction: column; gap: 16px;">

        <div style="position: relative; height: 168px; background: #232324; border-radius: 18px; display: flex; align-items: center; justify-content: center;">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6A6A6A" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M3 16.5l5-4 4 3 3-2.5 6 5"/></svg>
            <span class="s" style="font-size: 11.5px;">превью 1200×630</span>
          </div>
          <div class="pill" style="position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 7px; padding: 6px 12px; background: {{ o.stBg }};">
            <span style="width: 6px; height: 6px; border-radius: 50%; background: {{ o.stC }};"></span>
            <span style="font-size: 11.5px; font-weight: 600; color: {{ o.stC }};">{{ o.status }}</span>
          </div>
          <div class="pill" style="position: absolute; bottom: 12px; right: 12px; display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: #1C1C1D; border: 1px solid #3A3A42;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#E4E4E4" stroke-width="2.1"><path d="M12 3v13M7 11l5 5 5-5M4 20h16"/></svg>
            <span style="font-size: 12px; font-weight: 600;">Скачать</span>
          </div>
        </div>

        <div style="padding: 0 6px;">
          <div style="font-size: 21px; font-weight: 700; letter-spacing: -0.02em;">{{ o.name }}</div>
          <div class="s" style="margin-top: 6px;">{{ o.sub }}</div>
        </div>

        <div class="sub" style="padding: 14px 16px;">
          <div class="lab" style="font-size: 9.5px; margin-bottom: 11px;">Доступные гео</div>
          <div style="display: flex; flex-wrap: wrap; gap: 7px;">
            <sc-for list="{{ o.geos }}" as="g" hint-placeholder-count="3">
              <span class="pill n" style="font-size: 12px; padding: 5px 12px; background: #333334; color: #E4E4E4;">{{ g }}</span>
            </sc-for>
          </div>
        </div>

        <div class="sub" style="padding: 14px 16px;">
          <div class="lab" style="font-size: 9.5px; margin-bottom: 11px; color: #CE6E58;">Исключения</div>
          <div style="display: flex; flex-wrap: wrap; gap: 7px;">
            <sc-for list="{{ o.bans }}" as="b" hint-placeholder-count="2">
              <span class="pill" style="font-size: 12px; padding: 5px 12px; background: #33221C; color: #CE6E58;">{{ b }}</span>
            </sc-for>
          </div>
        </div>

        <div style="flex-grow: 1;"></div>

        <div style="padding: 0 6px 4px 6px;">
          <sc-for list="{{ o.notes }}" as="t" hint-placeholder-count="2">
            <div style="display: flex; gap: 10px; margin-bottom: 8px;">
              <span style="width: 5px; height: 5px; border-radius: 50%; background: #8A8A8A; margin-top: 7px; flex: 0 0 5px;"></span>
              <span style="font-size: 12.5px; color: #C4C4C4; line-height: 1.5;">{{ t }}</span>
            </div>
          </sc-for>
          <div class="s" style="font-size: 11.5px; margin-top: 12px;">обновлено {{ o.updated }}</div>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":1320}}'>
class Component extends DCLogic {
  renderVals() {
    var C = {
      'Активен': { c: '#B4C68C', bg: '#252E1E' }, 'Тест': { c: '#E4E4E4', bg: '#2E2E2F' },
      'Пауза': { c: '#CE6E58', bg: '#2C1F1A' }, 'Умер': { c: '#A8A8A8', bg: '#232324' }
    };
    var raw = [
      { name: 'VitaJoint Forte', sub: 'Nutra · суставы · Everad', status: 'Активен', geos: ['IT', 'ES', 'PT'], bans: ['Google Ads', 'инцент'], notes: ['Апрув выше на возрасте 45+', 'Лендинг только на местном языке'], updated: '24.08' },
      { name: 'Keto Slim Pro', sub: 'Nutra · похудение · Adcombo', status: 'Активен', geos: ['DE', 'AT', 'CH'], bans: ['бренд-беттинг', 'инцент', 'спам'], notes: ['Кап 150 в день, к обеду обычно выбран', 'До/после в крео — запрещено'], updated: '26.08' },
      { name: 'SlimTea Detox', sub: 'Nutra · детокс · Everad', status: 'Активен', geos: ['RO', 'BG', 'HU'], bans: ['инцент'], notes: ['Принимают только COD-заявки', 'Колл-центр работает до 20:00'], updated: '19.08' },
      { name: 'CryptoEdge', sub: 'Finance · трейдинг · Leadrock', status: 'Пауза', geos: ['PL', 'CZ', 'SK'], bans: ['Google Ads', 'обещания дохода'], notes: ['На паузе до новых условий', 'Нужен дисклеймер о рисках'], updated: '12.08' },
      { name: 'GlucoBalance', sub: 'Nutra · диабет · Adcombo', status: 'Тест', geos: ['FR', 'BE'], bans: ['мед. заявления', 'инцент'], notes: ['Тестовый залив, лимит $300 в день', 'Слово «лечение» в тексте — бан'], updated: '25.08' },
      { name: 'AutoLoan Fast', sub: 'Finance · займы · Leadrock', status: 'Умер', geos: ['MX', 'CO'], bans: ['брендовый трафик'], notes: ['Рекламодатель закрыл направление', 'Держим карточку ради архива крео'], updated: '03.08' }
    ];
    var chips = [
      { t: 'Все · 18', bg: '#3A3A3B', fg: '#E4E4E4', w: '600' },
      { t: 'Активные · 11', bg: '#232324', fg: '#A8A8A8', w: '500' },
      { t: 'Тест · 3', bg: '#232324', fg: '#A8A8A8', w: '500' },
      { t: 'Пауза · 2', bg: '#232324', fg: '#A8A8A8', w: '500' },
      { t: 'Умершие · 2', bg: '#232324', fg: '#A8A8A8', w: '500' }
    ];
    var crew = [
      { t: 'NM', bg: '#3A452E', fg: '#B4C68C' }, { t: 'SK', bg: '#3A3A3B', fg: '#E4E4E4' },
      { t: 'LN', bg: '#3A3A3B', fg: '#E4E4E4' }, { t: 'VP', bg: '#3A3A3B', fg: '#E4E4E4' },
      { t: 'AR', bg: '#3B2620', fg: '#CE6E58' }
    ];
    return {
      chips: chips, crew: crew,
      offers: raw.map(function (o) {
        var s = C[o.status];
        return { name: o.name, sub: o.sub, status: o.status, stC: s.c, stBg: s.bg, geos: o.geos, bans: o.bans, notes: o.notes, updated: o.updated };
      })
    };
  }
}
</script>
</body>
</html>
