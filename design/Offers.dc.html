<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Oswald:wght@200;300;400;500;600&display=swap">
  <style>
    body { margin: 0; background: #1E1E21; font-family: 'Golos Text', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; color: #D4D4D4; }
    a { color: #A4B183; text-decoration: none; } a:hover { color: #C3624C; }
    .n { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
    .d { font-family: 'Oswald', 'Golos Text', sans-serif; font-weight: 300; letter-spacing: -0.01em; }
    .lab { font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 400; letter-spacing: 0.24em; text-transform: uppercase; color: #5B5B5D; }
    .rule { height: 1px; background: #33333A; }
  </style>
</helmet>

<div style="display: flex; width: 1440px; min-height: 1200px; background: #1E1E21; color: #D4D4D4;">
  <aside style="width: 76px; flex: 0 0 76px; border-right: 1px solid #33333A; display: flex; flex-direction: column; align-items: center; padding: 24px 0 22px 0;">
    <div style="width: 32px; height: 32px; border: 1px solid #A4B183; display: flex; align-items: center; justify-content: center;">
      <span class="d" style="font-size: 16px; font-weight: 500; color: #A4B183;">S</span>
    </div>
    <div style="height: 22px;"></div>
    <div class="lab" style="writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: 0.42em; font-size: 9.5px;">STORI · TEAM</div>
    <div style="height: 30px;"></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B5B5D" stroke-width="1.5"><path d="M3 20h18M3 20V9l9-6 9 6v11"/><path d="M9 20v-6h6v6"/></svg>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B5B5D" stroke-width="1.5"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B5B5D" stroke-width="1.5"><path d="M3 21l9-16 9 16z"/><path d="M8.5 12.5h7"/></svg>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B5B5D" stroke-width="1.5"><path d="M21 8l-9-4.5L3 8l9 4.5L21 8z"/><path d="M3 8v8l9 4.5L21 16V8"/></svg>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B5B5D" stroke-width="1.5"><rect x="3" y="6" width="18" height="13"/><path d="M3 10.5h18"/></svg>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #26262A; border-left: 2px solid #A4B183;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A4B183" stroke-width="1.5"><path d="M3 12.5V4h8.5L21 13.5 12.5 22 3 12.5z"/><circle cx="8" cy="8" r="1.3"/></svg>
      </div>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="width: 32px; height: 32px; border: 1px solid #33333A; display: flex; align-items: center; justify-content: center;">
      <span class="n" style="font-size: 10px; color: #5B5B5D;">AD</span>
    </div>
  </aside>
  <main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">

    <div style="display: flex; align-items: center; justify-content: space-between; height: 66px; padding: 0 40px; border-bottom: 1px solid #33333A;">
      <div style="display: flex; align-items: center; gap: 13px;">
        <span class="lab" style="color: #D4D4D4;">Офферы</span>
        <span class="lab">/</span>
        <span class="lab">База</span>
      </div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <span class="n" style="font-size: 11.5px; color: #5B5B5D;">18 карточек</span>
        <div style="padding: 9px 17px; background: #A4B183;"><span class="lab" style="font-size: 10px; color: #1E1E21;">＋ Оффер</span></div>
      </div>
    </div>

    <!-- FILTERS -->
    <div style="display: flex; align-items: center; gap: 30px; padding: 0 40px; height: 62px; border-bottom: 1px solid #33333A;">
      <div style="display: flex; align-items: center; gap: 11px; flex-grow: 1; max-width: 300px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5B5B5D" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
        <span style="font-size: 13px; color: #5B5B5D;">Название, гео, партнёрка…</span>
      </div>
      <div style="width: 1px; height: 22px; background: #33333A;"></div>
      <div style="display: flex; align-items: center; gap: 24px;">
        <span class="lab" style="color: #D4D4D4; border-bottom: 1px solid #A4B183; padding-bottom: 3px;">Все</span>
        <span class="lab">Активные</span>
        <span class="lab">Тест</span>
        <span class="lab">Пауза</span>
        <span class="lab">Умершие</span>
      </div>
      <div style="flex-grow: 1;"></div>
      <div style="display: flex; align-items: center; gap: 9px;">
        <span class="lab" style="font-size: 9.5px;">Вертикаль</span>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#5B5B5D" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 9px;">
        <span class="lab" style="font-size: 9.5px;">Гео</span>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#5B5B5D" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>

    <!-- GRID -->
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); flex-grow: 1;">
      <sc-for list="{{ offers }}" as="o" hint-placeholder-count="6">
        <div style="border-right: 1px solid #33333A; border-bottom: 1px solid #33333A; padding: 26px 30px 30px 30px; display: flex; flex-direction: column; gap: 20px;">

          <div style="position: relative; height: 148px; background: #26262A; display: flex; align-items: center; justify-content: center;">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 9px;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B5B5D" stroke-width="1.4"><rect x="3" y="4" width="18" height="16"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M3 16l5-4 4 3 3-2.5 6 5"/></svg>
              <span class="lab" style="font-size: 9px;">Превью 1200×630</span>
            </div>
            <div style="position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 7px;">
              <span style="width: 6px; height: 6px; background: {{ o.stC }};"></span>
              <span class="lab" style="font-size: 9px; color: {{ o.stC }};">{{ o.status }}</span>
            </div>
            <div style="position: absolute; bottom: 12px; right: 12px; display: flex; align-items: center; gap: 8px; padding: 8px 13px; background: #1E1E21; border: 1px solid #4A4A50;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#D4D4D4" stroke-width="2"><path d="M12 3v13M7 11l5 5 5-5M4 20h16"/></svg>
              <span class="lab" style="font-size: 9px; color: #D4D4D4;">Скачать</span>
            </div>
          </div>

          <div>
            <div class="d" style="font-size: 25px; font-weight: 400; letter-spacing: 0.01em; line-height: 1.1;">{{ o.name }}</div>
            <div style="font-size: 12px; color: #5B5B5D; margin-top: 7px;">{{ o.sub }}</div>
          </div>

          <div>
            <div class="lab" style="font-size: 9px; margin-bottom: 10px;">Доступные гео</div>
            <div style="display: flex; flex-wrap: wrap; gap: 6px;">
              <sc-for list="{{ o.geos }}" as="g" hint-placeholder-count="4">
                <span class="n" style="font-size: 12px; padding: 5px 10px; border: 1px solid #4A4A50; color: #D4D4D4;">{{ g }}</span>
              </sc-for>
            </div>
          </div>

          <div>
            <div class="lab" style="font-size: 9px; margin-bottom: 10px; color: #C3624C;">Исключения</div>
            <div style="display: flex; flex-wrap: wrap; gap: 6px;">
              <sc-for list="{{ o.bans }}" as="b" hint-placeholder-count="3">
                <span style="font-size: 12px; padding: 5px 10px; border: 1px solid #4A3129; color: #C3624C;">{{ b }}</span>
              </sc-for>
            </div>
          </div>

          <div style="flex-grow: 1;"></div>

          <div style="border-top: 1px solid #33333A; padding-top: 14px;">
            <sc-for list="{{ o.notes }}" as="t" hint-placeholder-count="2">
              <div style="display: flex; gap: 10px; margin-bottom: 7px;">
                <span style="width: 8px; height: 1px; background: #5B5B5D; margin-top: 9px; flex: 0 0 8px;"></span>
                <span style="font-size: 12px; color: #D4D4D4; line-height: 1.5;">{{ t }}</span>
              </div>
            </sc-for>
            <div class="lab" style="font-size: 9px; margin-top: 12px;">Обновлено {{ o.updated }}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    var C = { 'Активен': '#A4B183', 'Тест': '#D4D4D4', 'Пауза': '#C3624C', 'Умер': '#5B5B5D' };
    var raw = [
      { name: 'VitaJoint Forte', sub: 'Nutra · суставы · Everad', status: 'Активен',
        geos: ['IT', 'ES', 'PT'], bans: ['Google Ads', 'инцент'],
        notes: ['Апрув выше на возрасте 45+', 'Лендинг только на местном языке'], updated: '24.08' },
      { name: 'Keto Slim Pro', sub: 'Nutra · похудение · Adcombo', status: 'Активен',
        geos: ['DE', 'AT', 'CH'], bans: ['бренд-беттинг', 'инцент', 'спам-рассылки'],
        notes: ['Кап 150 в день, к обеду обычно выбран', 'До/после в крео — запрещено'], updated: '26.08' },
      { name: 'SlimTea Detox', sub: 'Nutra · детокс · Everad', status: 'Активен',
        geos: ['RO', 'BG', 'HU'], bans: ['инцент'],
        notes: ['Принимают только COD-заявки', 'Колл-центр работает до 20:00'], updated: '19.08' },
      { name: 'CryptoEdge', sub: 'Finance · трейдинг · Leadrock', status: 'Пауза',
        geos: ['PL', 'CZ', 'SK'], bans: ['Google Ads', 'обещания дохода'],
        notes: ['На паузе до согласования новых условий', 'Нужен дисклеймер о рисках'], updated: '12.08' },
      { name: 'GlucoBalance', sub: 'Nutra · диабет · Adcombo', status: 'Тест',
        geos: ['FR', 'BE'], bans: ['мед. заявления', 'инцент'],
        notes: ['Тестовый залив, лимит $300 в день', 'Слово «лечение» в тексте — бан'], updated: '25.08' },
      { name: 'AutoLoan Fast', sub: 'Finance · займы · Leadrock', status: 'Умер',
        geos: ['MX', 'CO'], bans: ['брендовый трафик'],
        notes: ['Рекламодатель закрыл направление', 'Держим карточку ради архива крео'], updated: '03.08' }
    ];
    return {
      offers: raw.map(function (o) {
        return {
          name: o.name, sub: o.sub, status: o.status, stC: C[o.status],
          geos: o.geos, bans: o.bans, notes: o.notes, updated: o.updated
        };
      })
    };
  }
}
</script>
</body>
</html>
