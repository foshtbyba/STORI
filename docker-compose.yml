services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: msteam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
      POSTGRES_DB: msteam
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U msteam']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://msteam:${POSTGRES_PASSWORD}@db:5432/msteam
      AUTH_SECRET: ${AUTH_SECRET:?задай AUTH_SECRET в .env}
      # Пустой ключ выключает ручку /api/sync — так и задумано.
      SYNC_SECRET: ${SYNC_SECRET:-}
      # Часовой пояс, по которому синхронизация нарезает сутки. Контейнер живёт
      # в UTC, а день команды закрывается по Москве — без этого свежие цифры
      # уезжали бы на сутки назад.
      SYNC_TZ: ${SYNC_TZ:-Europe/Moscow}
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/login']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?задай DOMAIN в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db:
  caddy-data:
  caddy-config:
