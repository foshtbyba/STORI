<!DOCTYPE html>
<html lang="fr-BE">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votre commande</title>
  <link rel="icon" href="images/flexosamine.png?=v1">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f7fafc;
      color: #1a2b42;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .thanks {
      background: #fff;
      max-width: 520px;
      margin: 20px;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(10, 92, 158, 0.10);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .thanks img {
      max-width: 280px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 20px;
    }

    .thanks h1 {
      color: #0a5c9e;
      font-size: 28px;
      margin: 0 0 12px;
    }

    .thanks p {
      font-size: 17px;
      line-height: 1.6;
      margin: 8px 0;
    }
  </style>
</head>

<body>
  <div class="thanks">
    <img src="images/flexosamine.png" alt="Flexosamine Pro" loading="lazy">
    <h1>Votre commande a bien été reçue !</h1>
    <p>Nous avons enregistré vos coordonnées.</p>
    <p>Un conseiller vous contactera prochainement pour confirmer la livraison.</p>
  </div>
</body>

</html>
