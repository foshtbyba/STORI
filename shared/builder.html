<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конструктор лендов — завод в 1 клик</title>
<style>
  :root{--bg:#0f1420;--card:#161d2b;--line:#26314a;--fg:#e6ecf5;--mut:#8fa0bd;--acc:#3b82f6;--ok:#22c55e;--warn:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--fg);font-size:14px}
  header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  header h1{font-size:17px;margin:0}
  header .sub{color:var(--mut);font-size:12px}
  .wrap{display:grid;grid-template-columns:400px 1fr;gap:0;min-height:calc(100vh - 54px)}
  .panel{padding:18px 20px;overflow:auto}
  .panel.left{border-right:1px solid var(--line);background:var(--card)}
  label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.03em}
  input,select,textarea{width:100%;background:#0c111b;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit}
  textarea{min-height:180px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{margin-top:16px;width:100%;padding:13px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .btn:hover{filter:brightness(1.1)}
  .btn.sec{background:#243049}
  .btn.ok{background:var(--ok)}
  .hint{color:var(--mut);font-size:11.5px;margin-top:4px;line-height:1.5}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tab{padding:7px 12px;border:1px solid var(--line);border-radius:7px;background:#0c111b;color:var(--mut);cursor:pointer;font-size:12.5px}
  .tab.active{background:var(--acc);color:#fff;border-color:var(--acc)}
  .out{width:100%;min-height:60vh;background:#0c111b;border:1px solid var(--line);border-radius:8px;color:#d7e0ee;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;padding:12px;white-space:pre;overflow:auto}
  iframe{width:100%;min-height:60vh;border:1px solid var(--line);border-radius:8px;background:#fff}
  .dl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .dl button{padding:9px 12px;border:1px solid var(--line);background:#0c111b;color:var(--fg);border-radius:7px;cursor:pointer;font-size:12.5px}
  .dl button.zip{background:var(--ok);color:#04210f;border-color:var(--ok);font-weight:700}
  .status{font-size:12px;margin-top:10px;min-height:18px}
  .status.ok{color:var(--ok)} .status.warn{color:var(--warn)}
  .grp{border:1px solid var(--line);border-radius:10px;padding:2px 14px 14px;margin-top:14px}
  .grp h3{font-size:12px;color:var(--acc);letter-spacing:.04em;text-transform:uppercase;margin:14px 0 0}
  .chk{display:flex;align-items:center;gap:8px;margin-top:12px}
  .chk input{width:auto}
</style>
</head>
<body>
<header>
  <h1>🏭 Конструктор лендов</h1>
  <span class="sub">оффлайн · переменные + HTML → готовая папка. api_key не покидает браузер.</span>
</header>

<div class="wrap">
  <!-- ЛЕВО: форма -->
  <div class="panel left">
    <div class="grp">
      <h3>Партнёрка</h3>
      <label>Оффер-нетворк (адаптер)</label>
      <select id="partner"></select>
      <div class="hint" id="partnerHint"></div>

      <label>product_id *</label>
      <input id="product_id" placeholder="15058">
      <div class="row">
        <div><label>ref *</label><input id="ref" value="1029931"></div>
        <div><label>langCode *</label><input id="langCode" placeholder="be"></div>
      </div>
      <label>api_key *</label>
      <input id="api_key" placeholder="2188aad9cfb9f55626bf1d64cf4e95e0">
    </div>

    <div class="grp">
      <h3>Страницы и ссылки</h3>
      <div class="row">
        <div><label>success</label><input id="success" value="call.html"></div>
        <div><label>error</label><input id="error" value="error.html"></div>
      </div>
      <label>back-fix ссылка (демонетизация, пусто = выкл)</label>
      <input id="backfix" value="https://nutrivition.top/VXsVxCX?sun={sub_id_30}">
      <label>Язык текстов call/error/chest</label>
      <select id="uiLang">
        <option value="en">English</option>
        <option value="ru">Русский</option>
        <option value="fr">Français</option>
        <option value="nl">Nederlands</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="pt">Português</option>
      </select>
    </div>

    <div class="grp">
      <h3>Оффер (для call/error/chest)</h3>
      <div class="row">
        <div><label>Название бренда</label><input id="brand" placeholder="Flexosamine Pro"></div>
        <div><label>Картинка оффера</label><input id="image" value="images/flexosamine.png"></div>
      </div>
      <label>Цена (для сундука/страниц)</label>
      <input id="price" placeholder="39 €">
    </div>

    <div class="grp">
      <h3>Исходный HTML ленда</h3>
      <label>Вставь сырой HTML (index)</label>
      <textarea id="html" placeholder="<!DOCTYPE html>…"></textarea>
      <div class="chk"><input type="checkbox" id="autofix" checked><label style="margin:0;text-transform:none;letter-spacing:0">Авто-починка формы (проставить data-order-form + name/phone)</label></div>
      <div class="chk"><input type="checkbox" id="stripOld" checked><label style="margin:0;text-transform:none;letter-spacing:0">Вырезать старый инлайн-обработчик отправки (m1.top sendData)</label></div>
    </div>

    <button class="btn" id="build">⚙️ Собрать</button>
    <div class="status" id="status"></div>
  </div>

  <!-- ПРАВО: результат -->
  <div class="panel">
    <div class="dl">
      <button class="zip" id="dlzip">⬇ Скачать всё (zip)</button>
      <button data-f="index">index.html</button>
      <button data-f="call">call.html</button>
      <button data-f="error">error.html</button>
      <button data-f="chest">chest.html</button>
    </div>
    <div class="tabs">
      <div class="tab active" data-t="index">index.html</div>
      <div class="tab" data-t="call">call.html</div>
      <div class="tab" data-t="error">error.html</div>
      <div class="tab" data-t="chest">chest.html</div>
      <div class="tab" data-t="preview">👁 превью index</div>
    </div>
    <textarea class="out" id="out" spellcheck="false" readonly></textarea>
    <iframe id="prev" style="display:none"></iframe>
  </div>
</div>

<script>
/* ================= АДАПТЕРЫ ПАРТНЁРОК =================
   Добавить новую = один объект. Движок читает эти поля из OFFER. */
const PARTNERS = {
  "m1.top": {
    label: "m1.top",
    endpoint: "https://m1.top/send_order/",
    okField: "result", okValue: "ok", idField: "id",
    hint: "Стандарт: POST send_order, ответ {result:'ok', id}. Метки s/w/t/p/m из URL."
  },
  "custom": {
    label: "Другая (задать вручную)",
    endpoint: "", okField: "result", okValue: "ok", idField: "id",
    hint: "Заполни endpoint/okField/okValue/idField под свою партнёрку (продвинутое)."
  }
};

/* ================= ДВИЖОК, ВСТРАИВАЕМЫЙ В ЛЕНД ================= */
const ENGINE = `
(function () {
  "use strict";
  var API = OFFER.endpoint || "https://m1.top/send_order/";
  function pq(){var o={},q=location.search.substring(1);if(q)q.split("&").forEach(function(p){var k=p.split("=");if(k[0])o[k[0]]=decodeURIComponent(k[1]||"");});return o;}
  var Q=pq();
  var subid=(OFFER.subid&&OFFER.subid.indexOf("{")===-1)?OFFER.subid:"";
  var TR={s:Q.s||subid||"",w:Q.w||"",t:Q.t||"",p:Q.p||"",m:Q.m||""};
  function tqs(){return "&s="+encodeURIComponent(TR.s)+"&w="+encodeURIComponent(TR.w)+"&t="+encodeURIComponent(TR.t)+"&p="+encodeURIComponent(TR.p)+"&m="+encodeURIComponent(TR.m);}
  var ip="127.0.0.1";
  try{var xi=new XMLHttpRequest();xi.open("GET","https://ipapi.co/json/",true);xi.timeout=4000;xi.onreadystatechange=function(){if(xi.readyState===4&&xi.status===200){try{ip=(JSON.parse(xi.responseText)||{}).ip||ip;}catch(e){}}};xi.send();}catch(e){}
  if(OFFER.out!==false){try{var so=document.createElement("script");so.src=API+"?ref="+OFFER.ref+tqs()+"&product_id="+OFFER.product_id+"&out=1";document.body.appendChild(so);}catch(e){}}
  function findForm(){return document.querySelector(OFFER.formSelector||"[data-order-form]")||document.getElementById("order_form")||(function(){var t=document.querySelector('form input[type="tel"], form input[name="phone"]');return t?t.closest("form"):null;})();}
  function redir(base,id){location.replace(base+(base.indexOf("?")>-1?"&":"?")+(id?"order_id="+encodeURIComponent(id):"")+tqs());}
  function send(name,phone){
    var body="ref="+encodeURIComponent(OFFER.ref)+"&api_key="+encodeURIComponent(OFFER.api_key)+"&product_id="+encodeURIComponent(OFFER.product_id)+"&phone="+encodeURIComponent(phone)+"&name="+encodeURIComponent(name)+"&ip="+encodeURIComponent(ip)+"&s="+encodeURIComponent(TR.s)+"&w="+encodeURIComponent(TR.w)+"&t="+encodeURIComponent(TR.t)+"&p="+encodeURIComponent(TR.p)+"&m="+encodeURIComponent(TR.m)+"&referer="+encodeURIComponent(document.referrer)+"&langCode="+encodeURIComponent(OFFER.langCode||"");
    var r=new XMLHttpRequest();r.open("POST",API,true);r.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
    r.onreadystatechange=function(){if(r.readyState!==4)return;var ok=false,id="";try{var d=JSON.parse(r.responseText);ok=d[OFFER.okField||"result"]===(OFFER.okValue||"ok");id=d[OFFER.idField||"id"];}catch(e){}ok?redir(OFFER.success||"call.html",id):redir(OFFER.error||"error.html","");};
    r.onerror=function(){redir(OFFER.error||"error.html","");};
    r.send(body);
  }
  function init(){
    var f=findForm();if(!f){console.warn("[order] форма не найдена");return;}
    var n=f.querySelector('[name="name"], [data-order-name]');
    var p=f.querySelector('[name="phone"], [data-order-phone], input[type="tel"]');
    if(n){n.addEventListener("input",function(){var v=n.value.replace(/[^\\p{L}\\s]/gu,"").replace(/^\\s+/,"").replace(/\\s\\s+/," ");var pr=v.split(" ");if(pr.length>2)v=pr[0]+" "+pr[1];n.value=v;});n.addEventListener("blur",function(){n.value=n.value.trim();});}
    if(p)p.addEventListener("input",function(){p.value=p.value.replace(/\\D/g,"");});
    if(n&&Q.name&&Q.name!=="undefined")n.value=Q.name;
    if(p&&Q.phone&&Q.phone!=="undefined")p.value=Q.phone;
    f.addEventListener("submit",function(e){e.preventDefault();var name=n?n.value.trim():"",phone=p?p.value.trim():"";if(!name){alert(OFFER.msgName||"Введите корректное имя!");return;}if(!phone||phone.length<7){alert(OFFER.msgPhone||"Введите корректный номер телефона!");return;}var b=f.querySelector('[type=submit], button');if(b)b.disabled=true;send(name,phone);});
  }
  document.readyState==="loading"?document.addEventListener("DOMContentLoaded",init):init();
})();`;

/* ================= ГЕНЕРАЦИЯ ФАЙЛОВ ================= */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function offerObject(cfg){
  var o = {
    endpoint: cfg.endpoint, okField: cfg.okField, okValue: cfg.okValue, idField: cfg.idField,
    product_id: cfg.product_id, ref: cfg.ref, api_key: cfg.api_key, langCode: cfg.langCode,
    success: cfg.success, error: cfg.error, out: true,
    msgName: cfg.t.an, msgPhone: cfg.t.ap
  };
  return o;
}

function orderBlock(cfg){
  var lines = [
    "<!-- ===== DROP-IN блок заказа (сгенерирован конструктором) ===== -->",
    "<script>",
    "var OFFER = " + JSON.stringify(offerObject(cfg), null, 2) + ";",
    ENGINE,
    "<\/script>"
  ];
  if (cfg.backfix) {
    lines.push('<script src="js/ywbackfix.js" data-redirect="true" data-links=\'["'+cfg.backfix+'"]\'><\/script>');
  }
  lines.push("<!-- ===== конец блока ===== -->");
  return lines.join("\n");
}

function buildIndex(cfg){
  var html = cfg.html || "";
  if (!html.trim()) return "<!-- вставь HTML ленда слева -->";
  // 1) вырезать старый m1.top обработчик, чтобы не было двойной отправки
  if (cfg.stripOld){
    html = html.replace(/<script[^>]*>[\s\S]*?send_order[\s\S]*?<\/script>/gi, function(m){
      return /sendData|order_form|product_id/.test(m) ? "<!-- [конструктор] старый обработчик удалён -->" : m;
    });
    html = html.replace(/<script[^>]*m1ref\.js[^>]*><\/script>/gi, "");
    html = html.replace(/<script[^>]*ywbackfix\.js[^>]*>[\s\S]*?<\/script>/gi, "");
  }
  // 2) авто-починка формы
  if (cfg.autofix){
    html = html.replace(/<form\b(?![^>]*data-order-form)([^>]*)>/i, '<form data-order-form$1>');
    // name на первый text-input, phone на первый tel
    if (!/name=["']name["']/i.test(html))
      html = html.replace(/<input\b(?![^>]*type=["'](?:tel|hidden|submit|checkbox|radio|file)["'])(?![^>]*name=)([^>]*)>/i, '<input name="name"$1>');
    if (!/name=["']phone["']/i.test(html))
      html = html.replace(/<input\b([^>]*type=["']tel["'][^>]*)>/i, function(m,a){ return /name=/.test(a)?m:'<input name="phone" '+a+'>'; });
  }
  // 3) вставить блок перед </body>
  var block = orderBlock(cfg);
  if (/<\/body>/i.test(html)) html = html.replace(/<\/body>/i, block + "\n</body>");
  else html += "\n" + block;
  return html;
}

/* ================= МИНИ-ZIP (STORE, без зависимостей) ================= */
function crcTable(){var c,t=[];for(var n=0;n<256;n++){c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;}
var CRCT=crcTable();
function crc32(u8){var c=0xFFFFFFFF;for(var i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function strU8(s){return new TextEncoder().encode(s);}
function wr(arr,n,len){for(var i=0;i<len;i++){arr.push(n&0xFF);n>>>=8;}}
function makeZip(files){
  var local=[],central=[],offset=0;
  files.forEach(function(f){
    var data=strU8(f.str),crc=crc32(data),name=strU8(f.name);
    var lh=[];wr(lh,0x04034b50,4);wr(lh,20,2);wr(lh,0,2);wr(lh,0,2);wr(lh,0,2);wr(lh,0,2);wr(lh,crc,4);wr(lh,data.length,4);wr(lh,data.length,4);wr(lh,name.length,2);wr(lh,0,2);
    var rec=lh.concat(Array.from(name),Array.from(data));local.push({rec:rec,off:offset,crc:crc,name:name,len:data.length});offset+=rec.length;
  });
  var localBytes=[];local.forEach(function(l){localBytes=localBytes.concat(l.rec);});
  var cdStart=offset;
  local.forEach(function(l){
    var ch=[];wr(ch,0x02014b50,4);wr(ch,20,2);wr(ch,20,2);wr(ch,0,2);wr(ch,0,2);wr(ch,0,2);wr(ch,0,2);wr(ch,l.crc,4);wr(ch,l.len,4);wr(ch,l.len,4);wr(ch,l.name.length,2);wr(ch,0,2);wr(ch,0,2);wr(ch,0,2);wr(ch,0,2);wr(ch,0,4);wr(ch,l.off,4);
    central.push(ch.concat(Array.from(l.name)));
  });
  var cdBytes=[];central.forEach(function(c){cdBytes=cdBytes.concat(c);});
  var end=[];wr(end,0x06054b50,4);wr(end,0,2);wr(end,0,2);wr(end,files.length,2);wr(end,files.length,2);wr(end,cdBytes.length,4);wr(end,cdStart,4);wr(end,0,2);
  return new Uint8Array(localBytes.concat(cdBytes).concat(end));
}

var FILES = {};
function readCfg(){
  var pk = PARTNERS[document.getElementById("partner").value];
  var lang = document.getElementById("uiLang").value;
  return {
    endpoint: pk.endpoint || "https://m1.top/send_order/", okField: pk.okField, okValue: pk.okValue, idField: pk.idField,
    product_id: document.getElementById("product_id").value.trim(),
    ref: document.getElementById("ref").value.trim(),
    api_key: document.getElementById("api_key").value.trim(),
    langCode: document.getElementById("langCode").value.trim(),
    success: document.getElementById("success").value.trim()||"call.html",
    error: document.getElementById("error").value.trim()||"error.html",
    backfix: document.getElementById("backfix").value.trim(),
    brand: document.getElementById("brand").value.trim()||"Product",
    image: document.getElementById("image").value.trim()||"images/product.png",
    price: document.getElementById("price").value.trim()||"—",
    html: document.getElementById("html").value,
    autofix: document.getElementById("autofix").checked,
    stripOld: document.getElementById("stripOld").checked,
    t: TXT[lang]||TXT.en
  };
}
function build(){
  var cfg = readCfg();
  var st = document.getElementById("status");
  var miss = ["product_id","ref","api_key","langCode"].filter(function(k){return !cfg[k];});
  if (miss.length){ st.className="status warn"; st.textContent="Заполни обязательные: "+miss.join(", "); }
  else { st.className="status ok"; st.textContent="Готово ✓ Проверь вкладки и скачай."; }
  FILES = { index: buildIndex(cfg), call: buildCall(cfg), error: buildError(cfg), chest: buildChest(cfg) };
  showTab(currentTab);
}
var currentTab="index";
function showTab(t){
  currentTab=t;
  document.querySelectorAll(".tab").forEach(function(el){el.classList.toggle("active",el.dataset.t===t);});
  var out=document.getElementById("out"), prev=document.getElementById("prev");
  if(t==="preview"){out.style.display="none";prev.style.display="block";prev.srcdoc=FILES.index||"";}
  else{prev.style.display="none";out.style.display="block";out.value=FILES[t]||"";}
}
function download(name,str){
  var blob=new Blob([str],{type:"text/html;charset=utf-8"});var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
}
function downloadZip(){
  if(!FILES.index){build();}
  var zip=makeZip([{name:"index.html",str:FILES.index},{name:"call.html",str:FILES.call},{name:"error.html",str:FILES.error},{name:"chest.html",str:FILES.chest}]);
  var blob=new Blob([zip],{type:"application/zip"});var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="lander.zip";a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
}
