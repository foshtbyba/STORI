<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آپ کا آرڈر</title>
  <link rel="icon" href="images/JoActive.png?=v1">
  <style>
    body {
      margin: 0;
      direction: rtl;
      font-family: 'Segoe UI', Tahoma, 'Noto Nastaliq Urdu', 'Noto Naskh Arabic', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      background: #f7fafc;
      color: #1a2b42;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .thanks {
      background: #fff;
      max-width: 520px;
      margin: 20px;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(10, 92, 158, 0.10);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .thanks img {
      max-width: 280px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 20px;
    }

    .thanks h1 {
      color: #0a5c9e;
      font-size: 28px;
      margin: 0 0 12px;
    }

    .thanks p {
      font-size: 17px;
      line-height: 1.9;
      margin: 8px 0;
    }
  </style>
</head>

<body>
  <div class="thanks">
    <img src="images/JoActive.png" alt="JoActive" loading="lazy">
    <h1>آپ کا آرڈر موصول ہو گیا ہے!</h1>
    <p>ہم نے آپ کی معلومات محفوظ کر لی ہیں۔</p>
    <p>ہمارا نمائندہ ترسیل کی تصدیق کے لیے جلد آپ سے رابطہ کرے گا۔</p>
  </div>
</body>

</html>
