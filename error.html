<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grazie per l'ordine!</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- ВНИМАНИЕ: внешне это аналог call.html, но БЕЗ метрик               -->
  <!-- (сюда попадают дубликаты заказа и ошибки — метрики не подключать). -->
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #222;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .thanks {
      background: #fff;
      max-width: 520px;
      margin: 20px;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, .08);
    }

    .thanks img {
      max-width: 240px;
      height: auto;
      margin-bottom: 20px;
    }

    .thanks h1 {
      color: #c31a20;
      font-size: 28px;
      margin: 0 0 12px;
    }

    .thanks p {
      font-size: 17px;
      line-height: 1.5;
      margin: 8px 0;
    }
  </style>
</head>

<body>
  <div class="thanks">
    <img src="images/AlphaBeast.png" alt="Alpha Beast" loading="lazy">
    <h1>Grazie per il tuo ordine!</h1>
    <p>Il tuo ordine è stato registrato.</p>
    <p>Il nostro operatore ti contatterà a breve per confermare la consegna.</p>
  </div>
</body>

</html>
