<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <title>Artonova — Սխալ</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="no-referrer" name="referrer">
  <meta content="noindex, nofollow" name="robots">
  <link rel="icon" href="images/artonova.png?=v1">
  <!-- Meta Pixel -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    (function(){
      var p = new URLSearchParams(location.search).get('fbpx');
      if(!p){var m='{fbpx}';if(m.indexOf('{')===-1) p=m;}
      if(!p){try{p=localStorage.getItem('fb_pixel');}catch(e){}}
      if(p){fbq('init',p);fbq('track','PageView');}
    })();
  </script>
  <!-- End Meta Pixel -->
  <style>
    :root { --color-primary:#0a5c9e; --color-primary-dark:#084678; --color-danger:#c0392b; --color-danger-light:#fdecea; --color-text:#1a2b42; --color-text-muted:#4a5a70; --color-bg-soft:#f7fafc; --color-border:#d9e2ec; --radius-md:8px; --radius-lg:12px; --shadow-lg:0 10px 25px rgba(10,92,158,0.10),0 4px 10px rgba(10,92,158,0.05); --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; padding:0; font-family:var(--font-sans); background:var(--color-bg-soft); color:var(--color-text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { max-width:560px; width:90%; background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); border:1px solid var(--color-border); text-align:center; padding:40px 30px; margin:20px; }
    .icon { width:80px; height:80px; background:var(--color-danger-light); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 24px; font-size:40px; }
    h1 { font-size:24px; color:var(--color-danger); margin:0 0 16px; }
    p { font-size:16px; line-height:1.6; color:var(--color-text-muted); margin:0 0 12px; }
    .retry-link { display:inline-block; margin-top:20px; padding:12px 28px; background:var(--color-primary); color:#fff; text-decoration:none; border-radius:var(--radius-md); font-weight:600; font-size:15px; }
    .retry-link:hover { background:var(--color-primary-dark); }
    .phone { display:block; margin-top:16px; font-size:15px; color:var(--color-primary); font-weight:600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">❌</div>
    <h1>Սխալ է տեղի ունեցել!</h1>
    <p>
      ցավոկ, ձեր պատվերը չի կարող մորտավորվել։
    </p>
    <p>
      խնդրում ենք նորից փորձել կամ զանգեք մեր օպերատորին։
    </p>
    <a class="retry-link" href="index.html#form">Նորից փորձել</a>
  </div>
</body>
</html>
